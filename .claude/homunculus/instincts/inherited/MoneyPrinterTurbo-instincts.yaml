# MoneyPrinterTurbo Workflow Refactor Hardcoded Data To Json

## Action

Follow the refactor-hardcoded-data-to-json workflow:
1. Create a new JSON file in the appropriate data directory with the extracted data.
2. Modify the relevant Python service to load data from the new JSON file, using a helper or caching if needed.
3. Add or update regression tests to confirm the refactor does not change behavior.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: app/services/data/*.json, app/services/*.py, test/services/test_*.py

